# Lefthook configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: false
  commands:
    swagger:
      run: export PATH="/opt/homebrew/bin:/Users/anucha-tk/go/bin:$PATH" && task swagger:generate && git add api/
    lint:
      run: export PATH="/opt/homebrew/bin:/Users/anucha-tk/go/bin:$PATH" && task lint
    test:
      run: export PATH="/opt/homebrew/bin:/Users/anucha-tk/go/bin:$PATH" && task test:coverage

commit-msg:
  commands:
    "conventional-commits":
      run: npx --yes --package @commitlint/cli --package @commitlint/config-conventional commitlint --edit {1}
