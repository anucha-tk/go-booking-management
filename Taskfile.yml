version: '3'

vars:
  DB_URL: 'postgresql://melkey:password1234@localhost:5432/blueprint?sslmode=disable'
  MIGRATIONS_PATH: './internal/infrastructure/db/migrations'

tasks:
  default:
    desc: Build and test the application
    deps: [build, test]

  build:
    desc: Build the binary
    cmds:
      - echo "Building..."
      - go build -o main cmd/api/main.go

  run:
    env:
      GIN_MODE: release
    desc: Run the application
    cmds:
      - go run cmd/api/main.go

  routes:
    desc: List all registered API routes
    cmds:
      - go run cmd/api/main.go --list-routes

  routes:export:
    desc: Export all registered API routes to a JSON file
    cmds:
      - go run cmd/api/main.go --export-routes routes.json



  docker:up:
    desc: Start DB container in background
    cmds:
      - docker compose up -d --build

  docker:down:
    desc: Shutdown and remove DB container
    cmds:
      - docker compose down

  docker:stop:
    desc: Stop DB container
    cmds:
      - docker compose stop

  docker:restart:
    desc: Restart DB container
    cmds:
      - docker compose restart

  db:status:
    desc: Check database migration status
    cmds:
      - migrate -path {{.MIGRATIONS_PATH}} -database "{{.DB_URL}}" version

  db:migrate:up:
    desc: Run database migrations up
    cmds:
      - migrate -path {{.MIGRATIONS_PATH}} -database "{{.DB_URL}}" up

  db:migrate:down:
    desc: Rollback database migrations
    cmds:
      - migrate -path {{.MIGRATIONS_PATH}} -database "{{.DB_URL}}" down 1

  test:
    desc: Run unit tests
    cmds:
      - echo "Testing..."
      - go test ./... -v

  test:cover:
    desc: Run tests with coverage and open report in browser (gocov-html)
    cmds:
      - gocov test ./... | gocov-html > coverage.html
      - open coverage.html
    preconditions:
      - sh: command -v gocov >/dev/null 2>&1
        msg: "gocov is not installed. Run 'task tools:install' to install it."
      - sh: command -v gocov-html >/dev/null 2>&1
        msg: "gocov-html is not installed. Run 'task tools:install' to install it."

  test:coverage:
    desc: Run tests and ensure coverage is >= 80%
    cmds:
      - go test ./... -coverprofile=coverage.out
      - go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//' | awk '{if($1 < 80) { print "Coverage " $1 "% is below 80%"; exit 1 } else { print "Coverage " $1 "% meets 80% threshold" }}'

  itest:
    desc: Run integration tests
    cmds:
      - echo "Running integration tests..."
      - go test ./internal/database -v

  clean:
    desc: Clean build artifacts
    cmds:
      - echo "Cleaning..."
      - rm -f main

  watch:
    env:
      GIN_MODE: release
    desc: Live reload with air
    cmds:
      - air

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  sqlc:generate:
    desc: Generate Go code from SQL
    cmds:
      - sqlc generate

  swagger:install:
    desc: Install swag CLI
    cmds:
      - go install github.com/swaggo/swag/cmd/swag@latest

  swagger:generate:
    desc: Generate OpenAPI documentation
    cmds:
      - swag init -g cmd/api/main.go -o api

  tools:install:
    desc: Install dev tools (gocov, gocov-html)
    cmds:
      - go install github.com/axw/gocov/gocov@latest
      - go install github.com/matm/gocov-html/cmd/gocov-html@latest
