basePath: /
definitions:
  api.Response:
    properties:
      code:
        type: string
      data: {}
      errors: {}
      message:
        type: string
      requestId:
        type: string
      status:
        example: success
        type: string
    type: object
  api.UnauthorizedFormatResponse:
    description: Unauthorized error response (Invalid Format)
    properties:
      code:
        example: UNAUTHORIZED
        type: string
      message:
        example: Authorization header format must be Bearer <token>
        type: string
      requestId:
        example: 4af3b007-7f7b-44bc-800c-12df8ae15a47
        type: string
      status:
        example: error
        type: string
    type: object
  api.UnauthorizedResponse:
    description: Unauthorized error response
    properties:
      code:
        example: UNAUTHORIZED
        type: string
      message:
        example: Authorization header is required
        type: string
      requestId:
        example: 66c6aa26-d246-44dd-8ecd-a39e15973d82
        type: string
      status:
        example: error
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      accessToken:
        type: string
      refreshToken:
        type: string
    type: object
  dto.RefreshRequest:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
      role:
        type: string
    required:
    - email
    - password
    - role
    type: object
  dto.RegisterResponse:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        type: integer
      role:
        type: string
      updatedAt:
        type: string
    type: object
  handler.HealthData:
    properties:
      database:
        additionalProperties:
          type: string
        type: object
      status:
        example: OK
        type: string
      version:
        example: 1.0.0
        type: string
    type: object
  handler.HealthResponse:
    properties:
      data:
        $ref: '#/definitions/handler.HealthData'
      status:
        example: success
        type: string
    type: object
host: localhost:8088
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a booking management server.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Booking Management API
  version: "1.0"
paths:
  /v1/:
    get:
      description: get API welcome message
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
      summary: API Root
      tags:
      - system
  /v1/admin/users:
    get:
      description: get list of all registered users
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Invalid format (missing Bearer prefix)
          schema:
            $ref: '#/definitions/api.UnauthorizedFormatResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - Bearer: []
      summary: List all users (Admin only)
      tags:
      - admin
  /v1/auth/login:
    post:
      consumes:
      - application/json
      description: login with email and password to receive access and refresh tokens
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      summary: Login a user
      tags:
      - auth
  /v1/auth/logout:
    post:
      consumes:
      - application/json
      description: revoke the access token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - Bearer: []
      summary: Logout a user
      tags:
      - auth
  /v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: get a new access token using a valid refresh token
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      summary: Refresh access token
      tags:
      - auth
  /v1/auth/register:
    post:
      consumes:
      - application/json
      description: create a new user account with email, password, and role
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.RegisterResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      summary: Register a new user
      tags:
      - auth
  /v1/debug/routes:
    get:
      description: get all registered routes (Dev only)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items: {}
            type: array
      summary: Debug API Routes
      tags:
      - debug
  /v1/health:
    get:
      consumes:
      - application/json
      description: get API health status including database connectivity
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.HealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handler.HealthResponse'
      summary: Health Check
      tags:
      - health
securityDefinitions:
  Bearer:
    description: 'MANDATORY: Type "Bearer " followed by a space and your JWT token.
      Example: "Bearer eyJhbGci..."'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
