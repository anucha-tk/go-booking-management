basePath: /
definitions:
  api.Response:
    properties:
      code:
        type: string
      data: {}
      errors: {}
      message:
        type: string
      requestId:
        type: string
      status:
        example: success
        type: string
    type: object
  api.UnauthorizedFormatResponse:
    description: Unauthorized error response (Invalid Format)
    properties:
      code:
        example: UNAUTHORIZED
        type: string
      message:
        example: Authorization header format must be Bearer <token>
        type: string
      requestId:
        example: 4af3b007-7f7b-44bc-800c-12df8ae15a47
        type: string
      status:
        example: error
        type: string
    type: object
  api.UnauthorizedResponse:
    description: Unauthorized error response
    properties:
      code:
        example: UNAUTHORIZED
        type: string
      message:
        example: Authorization header is required
        type: string
      requestId:
        example: 66c6aa26-d246-44dd-8ecd-a39e15973d82
        type: string
      status:
        example: error
        type: string
    type: object
  dto.AdminBookingResponse:
    properties:
      createdAt:
        type: string
      endDate:
        type: string
      id:
        type: integer
      roomId:
        type: integer
      roomNumber:
        type: string
      roomType:
        type: string
      startDate:
        type: string
      status:
        type: string
      totalPrice:
        type: integer
      userEmail:
        type: string
      userId:
        type: integer
    type: object
  dto.BookingResponse:
    properties:
      createdAt:
        type: string
      endDate:
        type: string
      id:
        type: integer
      roomId:
        type: integer
      startDate:
        type: string
      status:
        type: string
      totalPrice:
        type: integer
      userId:
        type: integer
    type: object
  dto.CreateBookingRequest:
    properties:
      endDate:
        type: string
      roomId:
        type: integer
      startDate:
        type: string
    required:
    - endDate
    - roomId
    - startDate
    type: object
  dto.CreateRoomRequest:
    properties:
      price:
        type: integer
      roomNumber:
        type: string
      type:
        type: string
    required:
    - price
    - roomNumber
    - type
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      accessToken:
        type: string
      refreshToken:
        type: string
    type: object
  dto.RefreshRequest:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
      role:
        type: string
    required:
    - email
    - password
    - role
    type: object
  dto.RegisterResponse:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        type: integer
      role:
        type: string
      updatedAt:
        type: string
    type: object
  dto.RoomResponse:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      price:
        type: integer
      roomNumber:
        type: string
      status:
        type: string
      type:
        type: string
      updatedAt:
        type: string
    type: object
  dto.UpdateRoomRequest:
    properties:
      price:
        type: integer
      roomNumber:
        type: string
      status:
        type: string
      type:
        type: string
    required:
    - price
    - roomNumber
    - status
    - type
    type: object
  dto.UpdateRoomStatusRequest:
    properties:
      status:
        type: string
    required:
    - status
    type: object
  dto.UserBookingResponse:
    properties:
      createdAt:
        type: string
      endDate:
        type: string
      id:
        type: integer
      roomId:
        type: integer
      roomNumber:
        type: string
      roomType:
        type: string
      startDate:
        type: string
      status:
        type: string
      totalPrice:
        type: integer
      userId:
        type: integer
    type: object
  handler.HealthData:
    properties:
      database:
        additionalProperties:
          type: string
        type: object
      status:
        example: OK
        type: string
      version:
        example: 1.0.0
        type: string
    type: object
  handler.HealthResponse:
    properties:
      data:
        $ref: '#/definitions/handler.HealthData'
      status:
        example: success
        type: string
    type: object
  room.Booking:
    properties:
      endDate:
        type: string
      id:
        type: integer
      roomId:
        type: integer
      startDate:
        type: string
      status:
        type: string
    type: object
  room.Detail:
    properties:
      bookings:
        items:
          $ref: '#/definitions/room.Booking'
        type: array
      createdAt:
        type: string
      id:
        type: integer
      price:
        type: integer
      roomNumber:
        type: string
      status:
        type: string
      type:
        type: string
      updatedAt:
        type: string
    type: object
host: localhost:8088
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a booking management server.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Booking Management API
  version: "1.0"
paths:
  /v1/:
    get:
      description: get API welcome message
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
      summary: API Root
      tags:
      - system
  /v1/admin/users:
    get:
      description: get list of all registered users
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Invalid format (missing Bearer prefix)
          schema:
            $ref: '#/definitions/api.UnauthorizedFormatResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - Bearer: []
      summary: List all users (Admin only)
      tags:
      - admin
  /v1/auth/login:
    post:
      consumes:
      - application/json
      description: login with email and password to receive access and refresh tokens
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      summary: Login a user
      tags:
      - auth
  /v1/auth/logout:
    post:
      consumes:
      - application/json
      description: revoke the access token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - Bearer: []
      summary: Logout a user
      tags:
      - auth
  /v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: get a new access token using a valid refresh token
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.UnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      summary: Refresh access token
      tags:
      - auth
  /v1/auth/register:
    post:
      consumes:
      - application/json
      description: create a new user account with email, password, and role
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.RegisterResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      summary: Register a new user
      tags:
      - auth
  /v1/availability:
    get:
      description: get a list of available rooms for specific dates
      parameters:
      - description: Start date (YYYY-MM-DD)
        in: query
        name: start_date
        required: true
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: end_date
        required: true
        type: string
      - description: Filter by room type
        in: query
        name: type
        type: string
      - description: Filter by minimum price
        in: query
        name: price_min
        type: integer
      - description: Filter by maximum price
        in: query
        name: price_max
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.RoomResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      summary: Search available rooms
      tags:
      - availability
  /v1/bookings:
    get:
      description: get a complete list of all bookings in the system (Admin/Officer
        only)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.AdminBookingResponse'
                  type: array
              type: object
      security:
      - Bearer: []
      summary: List all bookings
      tags:
      - bookings
    post:
      consumes:
      - application/json
      description: create a new booking for the authenticated user
      parameters:
      - description: Booking details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateBookingRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.BookingResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - Bearer: []
      summary: Submit a booking request
      tags:
      - bookings
  /v1/bookings/{id}/cancel:
    post:
      description: cancel an existing booking for the authenticated user
      parameters:
      - description: Booking ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.BookingResponse'
              type: object
      security:
      - Bearer: []
      summary: Cancel a booking
      tags:
      - bookings
  /v1/bookings/me:
    get:
      description: get a list of bookings for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.UserBookingResponse'
                  type: array
              type: object
      security:
      - Bearer: []
      summary: Get current user's bookings
      tags:
      - bookings
  /v1/debug/routes:
    get:
      description: get all registered routes (Dev only)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items: {}
            type: array
      summary: Debug API Routes
      tags:
      - debug
  /v1/health:
    get:
      consumes:
      - application/json
      description: get API health status including database connectivity
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.HealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handler.HealthResponse'
      summary: Health Check
      tags:
      - health
  /v1/rooms:
    get:
      description: get a list of all rooms with optional filtering
      parameters:
      - description: Filter by room type
        in: query
        name: type
        type: string
      - description: Filter by minimum price
        in: query
        name: price_min
        type: integer
      - description: Filter by maximum price
        in: query
        name: price_max
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.RoomResponse'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      summary: List all rooms
      tags:
      - rooms
    post:
      consumes:
      - application/json
      description: add a new room to the system (Admin only)
      parameters:
      - description: Room details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateRoomRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.RoomResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - Bearer: []
      summary: Create a new room
      tags:
      - rooms
  /v1/rooms/{id}:
    delete:
      description: remove a room from the system (Admin only)
      parameters:
      - description: Room ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - Bearer: []
      summary: Delete a room
      tags:
      - rooms
    get:
      description: get full details of a specific room including booking history
      parameters:
      - description: Room ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/room.Detail'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      summary: Get room details
      tags:
      - rooms
    put:
      consumes:
      - application/json
      description: update an existing room (Admin only)
      parameters:
      - description: Room ID
        in: path
        name: id
        required: true
        type: integer
      - description: Room details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateRoomRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.RoomResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - Bearer: []
      summary: Update room details
      tags:
      - rooms
  /v1/rooms/{id}/status:
    patch:
      consumes:
      - application/json
      description: update the status of a specific room (Admin/Officer)
      parameters:
      - description: Room ID
        in: path
        name: id
        required: true
        type: integer
      - description: Status details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateRoomStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.RoomResponse'
              type: object
      security:
      - Bearer: []
      summary: Update room status
      tags:
      - rooms
securityDefinitions:
  Bearer:
    description: 'MANDATORY: Type "Bearer " followed by a space and your JWT token.
      Example: "Bearer eyJhbGci..."'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
